version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "=== VARIABLES ==="
      - echo $AWS_ACCOUNT_ID
      - echo $AWS_DEFAULT_REGION
      - echo $IMAGE_REPO_NAME

      - echo "=== IAM ==="
      - aws sts get-caller-identity

      - echo "=== VERSION AWS CLI ==="
      - aws --version

      - echo "=== VERSION DOCKER ==="
      - docker --version

      - echo "=== LOGIN ECR ==="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Build OK"

artifacts:
  files:
    - '**/*'