version: 0.2

# Variables de entorno que deben estar configuradas en CodeBuild:
# AWS_ACCOUNT_ID: 875218874321
# AWS_DEFAULT_REGION: us-east-2
# IMAGE_REPO_NAME: api-calendariolaboral
# CONTAINER_NAME: api-calendario-container

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Haciendo login en Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION \
        | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH}
      - echo "REPOSITORY_URI=$REPOSITORY_URI"
      - echo "IMAGE_TAG=$IMAGE_TAG"

  build:
    commands:
      - echo "Compilando la API con Maven..."
      - mvn clean install -DskipTests
      - echo "Construyendo la imagen Docker..."
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Subiendo la imagen Docker a Amazon ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Generando archivo imagedefinitions.json..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
